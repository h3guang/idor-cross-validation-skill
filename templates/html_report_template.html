<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>越权渗透测试报告</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #333; border-bottom: 3px solid #007bff; padding-bottom: 10px; }
        h2 { color: #555; margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-card { background: #f0f0f0; padding: 15px 25px; border-radius: 8px; text-align: center; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #007bff; }
        .critical { color: #dc3545; }
        .high { color: #fd7e14; }
        .medium { color: #ffc107; }
        .low { color: #28a745; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <h1>越权渗透测试报告</h1>

    <h2>扫描概况</h2>
    <div class="stats">
        <div class="stat-card"><div class="number">{{scanned_apis}}</div><div class="label">扫描接口</div></div>
        <div class="stat-card"><div class="number">{{total_vulns}}</div><div class="label">发现漏洞</div></div>
        <div class="stat-card"><div class="number">{{critical}}</div><div class="label">严重漏洞</div></div>
        <div class="stat-card"><div class="number">{{high}}</div><div class="label">高危漏洞</div></div>
    </div>

    <h2>漏洞列表</h2>
    <table>
        <tr><th>ID</th><th>端点</th><th>严重性</th><th>置信度</th></tr>
        {{vulnerability_rows}}
    </table>

    <h2>修复建议</h2>
    {{fixes}}

    <p style="margin-top:30px;color:#999;font-size:12px;">报告生成时间: {{time}}</p>
</div>
</body>
</html>
